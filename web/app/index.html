<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Gacha — ダウンロード</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --ios: #3b82f6;
      --android: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e3a5f, var(--bg));
      color: var(--text);
      padding: 24px;
    }
    main {
      width: min(100%, 360px);
      background: var(--card);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    a {
      display: block;
      margin: 10px 0;
      padding: 14px 16px;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
    .ios { background: var(--ios); }
    .android { background: var(--android); }
  </style>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var ios = /iPhone|iPad|iPod/i.test(ua);
      var android = /Android/i.test(ua);
      var iosUrl = 'https://apps.apple.com/jp/app/unit-gacha/id6756411322';
      var androidUrl = 'https://play.google.com/store/apps/details?id=com.joyphysics.unitgacha';
      if (ios) location.replace(iosUrl);
      else if (android) location.replace(androidUrl);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Unit Gacha</h1>
    <p>ストアを選んでダウンロード</p>
    <a class="ios" href="https://apps.apple.com/jp/app/unit-gacha/id6756411322">App Store</a>
    <a class="android" href="https://play.google.com/store/apps/details?id=com.joyphysics.unitgacha">Google Play</a>
  </main>
</body>
</html>
